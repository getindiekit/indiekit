name: publish

on:
  workflow_dispatch:
    inputs:
      from-package:
        description: Publish package.json versions not yet on npm (no version bump)
        type: boolean
        default: false

# Ensure only one release workflow runs at a time
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'getindiekit/indiekit'
    permissions:
      id-token: write # Required for OIDC
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      - name: Download localisations
        uses: localazy/download@v1
        with:
          read_key: ${{ secrets.LOCALAZY_READ_KEY }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Release tooling has its own lockfile, so it isn’t installed with the
      # workspace but its versions are still pinned for this job
      - name: Install release tooling
        run: npm ci --prefix .github/release --ignore-scripts

      - name: Publish to npm
        run: |
          if [ "${{ inputs.from-package }}" = "true" ]; then
            .github/release/node_modules/.bin/lerna publish from-package --yes
          else
            .github/release/node_modules/.bin/lerna publish --conventional-commits --yes
          fi
